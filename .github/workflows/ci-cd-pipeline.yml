name: CI/CD Pipeline

on:
  push:
    branches: [ main, lab4 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/penguin-classifier:latest

  deploy-and-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          VAULT_DEV_ROOT_TOKEN_ID=${{ secrets.VAULT_DEV_ROOT_TOKEN_ID }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          KAFKA_TOPIC=penguin-predictions
          EOF

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is up"
              break
            fi
            echo "Waiting... ($i)"
            sleep 5
          done

      - name: Verify Vault secrets
        run: |
          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=${{ secrets.VAULT_DEV_ROOT_TOKEN_ID }} \
            penguin-vault vault kv get secret/db
          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=${{ secrets.VAULT_DEV_ROOT_TOKEN_ID }} \
            penguin-vault vault kv get secret/kafka

      - name: Verify Kafka topic
        run: |
          docker exec penguin-kafka kafka-topics --bootstrap-server localhost:9092 --list || true

      - name: Install pytest and requests
        run: pip install pytest requests

      - name: Run functional tests
        run: pytest tests/test_api.py -v
        env:
          API_URL: "http://localhost:8000"

      - name: Stop services
        if: always()
        run: docker compose down -v