services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: danitri/penguin-classifier:latest
    container_name: penguin-classifier-api
    ports:
      - "8000:8000"
    volumes:
      # Пробрасываем папку с моделью и данными (опционально, для разработки)
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s